# Integração contínua do Jardim Menu.
#
# Roda o que o CLAUDE.md e o REQUISITOS-v1.8.md exigem em máquina limpa, a cada push e a
# cada pull request que mexa no projeto:
#
#   - front: tipos (NF-010, `tsc --noEmit` limpo no CI), lint, testes de unidade, build de
#     produção e as verificações de segurança que não dependem de servidor (§9.4, regras 1
#     e 4 das seis invioláveis: nenhuma escrita anônima, e `service_role` fora do bundle);
#   - banco: migrações num Postgres vazio e os testes pgTAP (§9.1: "o CI roda a migração
#     base num banco vazio ... e roda o teste de conferência do plano").
#
# Sem segredo nenhum: nenhum `secrets.*` é lido aqui, e nada é publicado. A publicação é
# no servidor do dono do produto (decisão de 22/09/2026), por `infra/scripts/publicar.sh`,
# rodado de lá: deploy não entra neste arquivo, e as chaves não saem do servidor.
#
# O E2E do Playwright (§9.2) fica de fora por enquanto: ele precisa do banco com a massa de
# `seed.sql` e do servidor de produção no ar ao mesmo tempo, e isso é um terceiro job, a ser
# combinado antes de entrar. As medições NF-001 e NF-002 também não rodam aqui: elas são no
# tablet de verdade, no Wi-Fi do salão (ver JardimMenu/docs/qa/README.md).
name: Jardim Menu

on:
  push:
    paths:
      - "JardimMenu/**"
      # O próprio arquivo de CI entra no gatilho: mudar a esteira tem de provar a esteira.
      - ".github/workflows/jardim-menu.yml"
  pull_request:
    paths:
      - "JardimMenu/**"
      - ".github/workflows/jardim-menu.yml"

# Só leitura: este fluxo não escreve nada no repositório.
permissions:
  contents: read

jobs:
  front:
    name: Front (tipos, lint, unidade, build e segurança)
    runs-on: ubuntu-latest
    env:
      # Build sem telemetria: máquina de CI não é ambiente de quem escolheu participar.
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: JardimMenu/front
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 22 LTS, a mesma linha do `@types/node` do package.json.
          node-version: "22"
          cache: npm
          cache-dependency-path: JardimMenu/front/package-lock.json

      - name: Instalar as dependências travadas
        run: npm ci

      - name: TypeScript estrito (NF-010)
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint .

      - name: Testes de unidade (Vitest)
        run: npx vitest run

      - name: Build de produção, sobre o cardápio de exemplo
        # Sem Supabase no CI: qualquer valor diferente de "supabase" mantém a fonte de
        # exemplo (lib/menu-source.ts), e as variáveis do banco ficam ausentes de propósito.
        # É o build que gera o .next/static que o passo seguinte vasculha (§9.4).
        env:
          NEXT_PUBLIC_DATA_SOURCE: exemplo
        run: npm run build

      - name: Verificações de segurança estáticas e do bundle (§9.4)
        # Sem `--url`: só as checagens que não precisam de servidor. O script não lê nenhuma
        # variável do Supabase obrigatoriamente — a chave `anon` só é conferida se existir,
        # e a `service_role` é procurada pelo nome, não pelo valor.
        run: node scripts/verificar-seguranca.mjs

  banco:
    name: Banco (migrações num banco vazio e pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          # Fixa, e igual à do `db:types` no package.json do front: a versão do CLI muda o
          # que roda no banco, e isso não pode variar entre a máquina e o CI.
          version: 2.117.0

      - name: Subir o Postgres e aplicar as migrações
        # `db start` levanta só o banco (não a pilha inteira) e aplica as migrações de
        # back/supabase/migrations num banco vazio. O `--workdir` aponta para a pasta que
        # contém `supabase/`, como no `db:types` do front.
        run: supabase db start --workdir JardimMenu/back

      - name: Testes de banco (pgTAP)
        run: supabase test db --local --workdir JardimMenu/back
  ponta-a-ponta:
    name: Navegador e API (E2E, ponta a ponta e segurança no servidor)
    runs-on: ubuntu-latest
    # A máquina de quem desenvolve não dá conta desta série: nela um cenário de 90 s de
    # limite chegou a aparecer no relatório com 50 min, sempre num teste diferente, por
    # disputa de disco e de sincronização de nuvem. Em máquina limpa a mesma série leva
    # minutos. Foi por isso que o E2E saiu de "a combinar" e entrou aqui (23/09/2026).
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: JardimMenu/front/package-lock.json

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Subir o Supabase local inteiro
        # `start`, e não `db start`: o E2E faz login da equipe (GoTrue), assina o Realtime
        # e envia foto (Storage). Só o banco não basta.
        run: supabase start --workdir JardimMenu/back

      - name: Ler os endereços e as chaves do Supabase local
        # Chaves de instância efêmera, criadas agora e descartadas com o runner. A
        # service_role entra como variável de EXECUÇÃO, nunca sob NEXT_PUBLIC_ (regra 4 do
        # CLAUDE.md): quem precisa dela é o convite de usuário (JM-060) na prova ponta a
        # ponta. O passo de segurança logo abaixo confere que ela não foi para o bundle.
        run: |
          STATUS="$(supabase status --workdir JardimMenu/back -o json)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | jq -r .API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | jq -r .ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r .SERVICE_ROLE_KEY)"
            echo "MAILPIT_URL=$(echo "$STATUS" | jq -r .MAILPIT_URL)"
            echo "NEXT_PUBLIC_DATA_SOURCE=supabase"
            echo "NEXT_PUBLIC_APP_ORIGIN=http://localhost:3000"
          } >> "$GITHUB_ENV"

      - name: Instalar as dependências travadas
        working-directory: JardimMenu/front
        run: npm ci

      - name: Build de produção, apontando para o Supabase local
        working-directory: JardimMenu/front
        run: npm run build

      - name: Instalar o Chrome que o Playwright usa
        # O playwright.config.ts fixa channel "chrome", para nada ser baixado na máquina de
        # quem desenvolve. No runner o Chrome não vem instalado, então ele entra aqui.
        working-directory: JardimMenu/front
        run: npx playwright install chrome --with-deps

      - name: E2E no navegador (§9.2)
        working-directory: JardimMenu/front
        run: npx playwright test

      - name: Banco limpo antes da prova ponta a ponta
        # Ela grava dados e exige massa limpa; está escrito no cabeçalho do próprio script.
        run: supabase db reset --workdir JardimMenu/back

      - name: Subir o servidor de produção para as duas provas seguintes
        working-directory: JardimMenu/front
        # O mesmo server.js que a imagem Docker publica, e não `next start`, que o Next
        # avisa não funcionar com output standalone.
        run: |
          # nohup e setsid: o passo termina, e sem isso o servidor levaria SIGHUP junto e os
          # dois passos seguintes bateriam num endereço morto.
          nohup npm run start:standalone > /tmp/jardim-servidor.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/api/saude; then
              echo "servidor no ar"
              exit 0
            fi
            sleep 2
          done
          echo "o servidor nao subiu em 60 s" >&2
          exit 1

      - name: Prova ponta a ponta (API e banco de verdade)
        working-directory: JardimMenu/front
        run: node scripts/verificar-ponta-a-ponta.mjs --url http://127.0.0.1:3000

      - name: Segurança, agora também nas rotas do servidor
        working-directory: JardimMenu/front
        run: node scripts/verificar-seguranca.mjs --url http://127.0.0.1:3000

      - name: Guardar o rastro dos cenários que falharam
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rastro
          path: JardimMenu/front/test-results/
          retention-days: 7
